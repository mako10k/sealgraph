name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - name: Install development checks
        run: npm ci
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Clone detection
        run: npm run clone-check
      - name: Cyclomatic complexity
        run: make complexity-check
      - name: Dead code
        run: make deadcode-check
      - name: Standalone beta artifact smoke
        run: make beta-artifact-smoke VERSION=0.1.0-beta.1
